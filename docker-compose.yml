services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: housing_analytics
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d housing_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    depends_on: 
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "8000:8000"
volumes:
  postgres_data: